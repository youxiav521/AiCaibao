services:
  redis:
    container_name: yusys-redis
    image: public.ecr.aws/docker/library/redis:7-alpine
    ports:
      - "6379:6379"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
  elastic-search:
    container_name: yusys-elastic-search
    image: docker.elastic.co/elasticsearch/elasticsearch:8.12.0
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms1g -Xmx1g
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 30s

  nebula-metad:
    container_name: yusys-nebula-metad
    image: docker.m.daocloud.io/vesoft/nebula-metad:v3.8.0
    profiles: ["nebula"]
    environment:
      USER: root
      TZ: Asia/Shanghai
    command:
      - --meta_server_addrs=nebula-metad:9559
      - --local_ip=nebula-metad
      - --ws_ip=nebula-metad
      - --port=9559
      - --ws_http_port=19559
      - --data_path=/data/meta
      - --log_dir=/logs
      - --v=0
      - --minloglevel=0
    volumes:
      - nebula_metad_data:/data/meta
      - nebula_metad_logs:/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://nebula-metad:19559/status"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  nebula-storaged:
    container_name: yusys-nebula-storaged
    image: docker.m.daocloud.io/vesoft/nebula-storaged:v3.8.0
    profiles: ["nebula"]
    environment:
      USER: root
      TZ: Asia/Shanghai
    command:
      - --meta_server_addrs=nebula-metad:9559
      - --local_ip=nebula-storaged
      - --ws_ip=nebula-storaged
      - --port=9779
      - --ws_http_port=19779
      - --data_path=/data/storage
      - --log_dir=/logs
      - --v=0
      - --minloglevel=0
    depends_on:
      nebula-metad:
        condition: service_healthy
    volumes:
      - nebula_storaged_data:/data/storage
      - nebula_storaged_logs:/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://nebula-storaged:19779/status"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  nebula-graphd:
    container_name: yusys-nebula-graphd
    image: docker.m.daocloud.io/vesoft/nebula-graphd:v3.8.0
    profiles: ["nebula"]
    environment:
      USER: root
      TZ: Asia/Shanghai
    command:
      - --meta_server_addrs=nebula-metad:9559
      - --local_ip=nebula-graphd
      - --ws_ip=nebula-graphd
      - --port=9669
      - --ws_http_port=19669
      - --log_dir=/logs
      - --enable_authorize=true
      - --v=0
      - --minloglevel=0
    depends_on:
      nebula-metad:
        condition: service_healthy
    ports:
      - "127.0.0.1:9669:9669"
    volumes:
      - nebula_graphd_logs:/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://nebula-graphd:19669/status"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  nebula-init:
    container_name: yusys-nebula-init
    image: docker.m.daocloud.io/vesoft/nebula-console:v3.8.0
    profiles: ["nebula"]
    entrypoint: ["/bin/sh", "/init/init.sh"]
    environment:
      NEBULA_HOST: nebula-graphd
      NEBULA_PORT: "9669"
      NEBULA_USER: root
      NEBULA_PASSWORD: nebula
      NEBULA_QUERY_USER: kg_query
      NEBULA_QUERY_PASSWORD: nebula_query
      NEBULA_SPACE: knowledge_graph
      NEBULA_STORAGE_HOST: nebula-storaged
      NEBULA_STORAGE_PORT: "9779"
    depends_on:
      nebula-graphd:
        condition: service_healthy
      nebula-storaged:
        condition: service_started
    volumes:
      - ./nebula:/init:ro
    restart: "no"

volumes:
  elasticsearch_data:
  nebula_metad_data:
  nebula_metad_logs:
  nebula_storaged_data:
  nebula_storaged_logs:
  nebula_graphd_logs:
