services:
  yusys-ai-api:
    image: ${YUSYS_AI_IMAGE}
    container_name: yusys-ai-api-${DEPLOY_ENV:-default}
    environment:
      - SOFFICE_BIN=/usr/bin/soffice
      - TZ=Asia/Shanghai
    env_file:
      - ./.env_app
    ports:
      - "${YUSYS_AI_CONTAINER_PORT:-6300}:6300"
    volumes:
      - ./data/storage:/app/storage
      - ./data/logs/api:/app/logs
      - ./data/coder_venv:/app/src/agents/data_analyst_agent/coding_agent/code_executor/coder_venv
      - ./llm.json:/app/config/llm.json
      - ./.env_app:/app/.env
    working_dir: /app
    restart: unless-stopped
    depends_on:
      yusys-redis:
        condition: service_healthy
      yusys-elastic-search:
        condition: service_healthy
      yusys-minio:
        condition: service_healthy
    command: >
      sh -c "unset http_proxy https_proxy HTTP_PROXY HTTPS_PROXY && uv run --no-sync gunicorn -w 6 -k uvicorn.workers.UvicornWorker --timeout 1200 --max-requests 500 --max-requests-jitter 50  src.main:app --bind 0.0.0.0:6300"
  yusys-ai-worker:
    image: ${YUSYS_AI_IMAGE}
    container_name: yusys-ai-worker-${DEPLOY_ENV:-default}
    environment:
      - TZ=Asia/Shanghai
      - WORKER_MAX_JOBS=100
    volumes:
      - ./data/storage:/app/storage
      - ./data/logs/worker:/app/logs
      - ./data/coder_venv:/app/src/agents/data_analyst_agent/coding_agent/code_executor/coder_venv
      - ./llm.json:/app/config/llm.json
      - ./.env_app:/app/.env
    working_dir: /app
    restart: unless-stopped
    depends_on:
      yusys-redis:
        condition: service_healthy
      yusys-elastic-search:
        condition: service_healthy
      yusys-minio:
        condition: service_healthy
    command: >
      sh -c "unset http_proxy https_proxy HTTP_PROXY HTTPS_PROXY && uv run --no-sync arq src.worker.WorkerSettings"
  yusys-redis:
    container_name: yusys-redis-${DEPLOY_ENV:-default}
    image: public.ecr.aws/docker/library/redis:7-alpine
    ports:
      - "6479:6379"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
  yusys-elastic-search:
    container_name: yusys-elastic-search-${DEPLOY_ENV:-default}
    image: docker.elastic.co/elasticsearch/elasticsearch:8.12.0
    ports:
      - "49200:9200"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms1g -Xmx1g
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 30s
  yusys-minio:
    container_name: yusys-minio-${DEPLOY_ENV:-default}
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z.hotfix.7aa24e772
    ports:
      - "9100:9000"
      - "9101:9001"
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=yusys_2026_2025
    volumes:
      - minio_data:/minio/data
    restart: unless-stopped
    command: server /minio/data --console-address :9001
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9000/minio/health/live || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 20s

volumes:
  elasticsearch_data:
  minio_data:
